<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My glossary</title>
  <style>
    body { margin: 0; background: #212121; color: #ececec; font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 680px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 24px; margin: 0 0 16px; }
    input { width: 100%; padding: 10px 12px; font: inherit; color: inherit; background: #2f2f2f;
            border: 1px solid #444; border-radius: 10px; }
    #count { color: #9a9a9a; font-size: 13px; margin: 12px 0; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    li { background: #2f2f2f; border: 1px solid #444; border-radius: 12px; padding: 14px 16px; }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h2 { font-size: 17px; margin: 0; }
    button { font: 13px system-ui, sans-serif; color: #ddd; background: #3b3b3b; border: 1px solid #555;
             border-radius: 8px; padding: 4px 10px; cursor: pointer; }
    button:hover { background: #4a4a4a; }
    .def { margin: 8px 0 0; color: #cfcfcf; }
    .ctx { margin: 8px 0 0; font-size: 13px; color: #9a9a9a; }
    .date { margin: 6px 0 0; font-size: 12px; color: #777; }
      .top { display: flex; justify-content: space-between; align-items: flex-start; }
    #close { font-size: 22px; line-height: 1; padding: 2px 11px; }
  </style>
</head>
<body>
  <main>
    <div class="top"><h1>My glossary</h1><button id="close" type="button" aria-label="Close glossary" title="Close (Esc)">×</button></div>
    <input id="search" type="search" placeholder="Search terms…" autocomplete="off">
    <p id="count"></p>
    <ul id="list"></ul>
  </main>
  <script src="glossary.js"></script>
</body>
</html>
